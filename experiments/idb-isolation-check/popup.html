    <style>
      body {

  <body>
    <h1>Check 1 — inverse composability (popup ↔ SW share the IDB namespace)</h1>
    <p>
      Sends <code>position/list</code> to the SW. The popup runs under
      <code>chrome-extension://&lt;id&gt;</code>, the same origin as the SW, so it MUST see the
      SW-written sentinel. A content script (host-page origin) must NOT.
    </p>
    <div id="verdict">running…</div>
    <pre id="out"></pre>
    <script src="popup.js"></script>
  </body>
