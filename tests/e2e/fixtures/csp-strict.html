<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSP-Strict Fixture (#174)</title>
    <!--
      The strict CSP header is supplied at HTTP-response level via
      Playwright's `context.route` interception in tests/e2e/fonts-csp.spec.ts.
      A meta http-equiv CSP would weaken the test — header-supplied CSPs are
      the production case for sites like MDN, GitHub, banking apps. This
      page intentionally declares no <style>, <script>, or font references
      so that:

      - If a CSP-violation report fires, it must originate from the
        overlay's injected stylesheet / @font-face / shadow tree (the
        thing under test), not from the page itself.
      - If `document.fonts.check('1em OpenDyslexic')` returns true, the
        font face MUST have been registered by the overlay (no page-side
        registration exists).
    -->
  </head>
  <body>
    <main id="page-content">
      <h1>CSP-strict fixture</h1>
      <p>
        This page exists to host the SpeedReader overlay under a
        <code>default-src 'none'</code> Content Security Policy and verify
        the bundled OpenDyslexic font loads from
        <code>chrome-extension://</code> without CSP violations.
      </p>
    </main>
  </body>
</html>
