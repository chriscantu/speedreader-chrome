<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedReader Options</title>
  <style>
    body {
      width: 600px;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input, select {
      font-size: 14px;
      padding: 6px 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .saved {
      font-size: 12px;
      color: #2a9d3a;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>SpeedReader Options</h1>

  <div class="field">
    <label for="wpm">Words per minute</label>
    <input type="number" id="wpm" min="60" max="1500" value="300" />
  </div>

  <div class="field">
    <label for="fontSize">Font size</label>
    <select id="fontSize">
      <option value="12">Small</option>
      <option value="16" selected>Medium</option>
      <option value="20">Large</option>
      <option value="24">X-Large</option>
    </select>
  </div>

  <div class="field">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="sepia">Sepia</option>
    </select>
  </div>

  <div class="field">
    <label for="fontFamily">Font</label>
    <select id="fontFamily">
      <option value="system">System Default</option>
      <option value="open-dyslexic">OpenDyslexic</option>
    </select>
  </div>

  <div class="saved" id="saved">Settings saved!</div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
