<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedReader</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <h1>SpeedReader</h1>
    <div class="actions">
      <button
        type="button"
        id="read-article"
        class="action action--primary"
        aria-label="Read article"
      >
        Read article
      </button>
      <button
        type="button"
        id="read-selection"
        class="action action--secondary"
        aria-label="Read selection"
        aria-disabled="true"
        disabled
      >
        Read selection
      </button>
    </div>
    <div
      class="status"
      id="status"
      role="status"
      aria-live="polite"
    ></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
